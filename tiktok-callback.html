<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectando ao TikTok</title><meta name="description" content="Página de retorno do login do TikTok."><style>
:root{--ink:#1d1d1f;--mut:#6b6b70;--bg:#fff;--card:#fff4ec;--brand:#F0123C}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2f2;--mut:#a5a5ab;--bg:#141416;--card:#24201f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FF7A1A,#F0123C);display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:28px;line-height:1.15;margin:0}h2{font-size:19px;margin:28px 0 6px}
a{color:var(--brand)}.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 0}
.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:12px;margin:6px 8px 6px 0}
small,.mut{color:var(--mut)}footer{margin-top:40px;font-size:14px;color:var(--mut)}
</style></head><body><main><header><div class="logo">%</div><div><h1>Conectando ao TikTok</h1><small>Caiu o Preço</small></div></header>
<div class="card" id="msg">Lendo a resposta do TikTok…</div>
<p class="mut">Esta página só aparece uma vez, quando o dono do projeto conecta a conta do TikTok ao sistema de publicação.</p>
<script>
(function(){var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error'),m=document.getElementById('msg');
if(e){m.textContent='O TikTok não autorizou: '+e+'. Pode fechar e tentar de novo.';return;}
if(!c){m.textContent='Nenhum código recebido. Abra o link de conexão de novo.';return;}
m.innerHTML='<b>Conectado!</b> Agora copie o código abaixo e cole no GitHub (Actions → Conectar TikTok → Run workflow). Ele vale por poucos minutos.<br><br><code style="word-break:break-all">'+c.replace(/[<>&]/g,'')+'</code><br><br><button id="cp" class="btn" style="border:0">Copiar código</button>';
document.getElementById('cp').onclick=function(){navigator.clipboard.writeText(c);this.textContent='Copiado!';};})();
</script>
<footer><a href="./">Início</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de uso</a><br>Atualizado em 5 de novembro de 2026.</footer></main></body></html>
